name: Android CI

# Poterx Mobile (the phone app, OwnTV Mobile locked the way Poterx TV is): unit tests + lint, then a
# locked APK. The account comes from repository secrets
# (POTERX_PLAYLIST_URL or POTERX_SERVER/USERNAME/PASSWORD) or from the "Run workflow" form, which
# wins over the secrets so one repo can build an APK per customer. Without either the APK is an
# unlocked, stock-OwnTV build.
#
# Core (tv.own.owntv:core, :player-core) and the mpv engine resolve from OwnTV's public Maven
# repository, https://ahxn00.github.io/OwnTV_Core/maven — no token needed.

on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      playlist_url:
        description: "Linijka playlisty (http://host:port/playlist/USER/PASS/m3u_plus lub get.php?username=…). Puste = sekrety repo."
        required: false
        type: string
      server_url:
        description: "Sam serwer (http://host:port) — użytkownik wpisze login i hasło w aplikacji. Ignorowane, gdy podano linijkę."
        required: false
        type: string
      apk_label:
        description: "Dopisek do nazwy APK, np. nazwa klienta"
        required: false
        type: string

# Read by default: the check job runs branch code. Only the build job publishes (a Release on a tag).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest --stacktrace

      - name: Lint
        if: always()
        run: ./gradlew lintStandardDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn
          retention-days: 7

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tag builds publish a Release
    env:
      # Only a pushed tag publishes. "Run workflow" on a tag, with a customer's account in the form,
      # would otherwise upload that customer's APK as the Release and the update server's test build.
      IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      APK_OUT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version (from the git tag on releases)
        id: ver
        run: |
          if [ "$IS_TAG" = "true" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            # MAJOR.MINOR.PATCH with an optional HOTFIX (v0.1.0.1), one or two digits each: the code
            # below is only monotonic for those ("v0.1.0-rc1" would equal v0.1.0, "v0.1.08" is not a
            # number, 100 collides).
            if ! [[ "$NAME" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[.HOTFIX] (digits only, at most two per part)."
              exit 1
            fi
            IFS='.' read -r MA MI PA HF <<< "$NAME"
            # The television's scale from the start: MAJOR*1000000 + MINOR*10000 + PATCH*100 + HOTFIX
            # (0.1.0 = 10000, 0.1.0.1 = 10001, 0.2.0 = 20000), so updates only ever go up.
            CODE=$(( 10#$MA * 1000000 + 10#$MI * 10000 + 10#$PA * 100 + 10#${HF:-0} ))
            [ "$CODE" -gt 0 ] || CODE=1
          else
            # Dev builds: pinned above every release code (99.99.99.99 = 99999999), so they always install
            # over any published release.
            NAME="99.99.99"
            CODE=100000000
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME (code $CODE)"

      - name: Resolve the locked account
        env:
          INPUT_PLAYLIST_URL: ${{ inputs.playlist_url }}
          INPUT_SERVER_URL: ${{ inputs.server_url }}
          SECRET_PLAYLIST_URL: ${{ secrets.POTERX_PLAYLIST_URL }}
          SECRET_SERVER: ${{ secrets.POTERX_SERVER }}
          SECRET_USERNAME: ${{ secrets.POTERX_USERNAME }}
          SECRET_PASSWORD: ${{ secrets.POTERX_PASSWORD }}
          SECRET_SERVICE_PIN: ${{ secrets.POTERX_SERVICE_PIN }}
          SECRET_CONTACT: ${{ secrets.POTERX_CONTACT }}
          SECRET_TMDB_KEY: ${{ secrets.POTERX_TMDB_KEY }}
          SECRET_UPDATE_URL: ${{ secrets.POTERX_UPDATE_URL }}
        run: |
          # The form's text goes into GITHUB_ENV line by line: a newline in it would add variables.
          for v in "$INPUT_PLAYLIST_URL" "$INPUT_SERVER_URL"; do
            if [[ "$v" == *$'\n'* || "$v" == *$'\r'* ]]; then echo "::error::A form field holds more than one line."; exit 1; fi
          done
          if [ -n "$SECRET_TMDB_KEY" ]; then echo "::add-mask::$SECRET_TMDB_KEY"; echo "POTERX_TMDB_KEY=$SECRET_TMDB_KEY" >> "$GITHUB_ENV"; echo "TMDB key: set."; fi
          # Optional: the provider's own update server; the app then never asks GitHub.
          if [ -n "$SECRET_UPDATE_URL" ]; then echo "POTERX_UPDATE_URL=$SECRET_UPDATE_URL" >> "$GITHUB_ENV"; echo "Update server: set."; fi
          # Optional: a service PIN asked before signing out, and the provider's contact line.
          if [ -n "$SECRET_SERVICE_PIN" ]; then echo "POTERX_SERVICE_PIN=$SECRET_SERVICE_PIN" >> "$GITHUB_ENV"; echo "Service PIN: set."; fi
          if [ -n "$SECRET_CONTACT" ]; then echo "POTERX_CONTACT=$SECRET_CONTACT" >> "$GITHUB_ENV"; echo "Provider contact: set."; fi
          # The form field wins over the secrets. Everything is masked so it never shows in the log.
          if [ -n "$INPUT_PLAYLIST_URL" ]; then
            echo "::add-mask::$INPUT_PLAYLIST_URL"
            echo "POTERX_PLAYLIST_URL=$INPUT_PLAYLIST_URL" >> "$GITHUB_ENV"
            echo "Locked account: from the workflow form."
          elif [ -n "$SECRET_PLAYLIST_URL" ]; then
            echo "POTERX_PLAYLIST_URL=$SECRET_PLAYLIST_URL" >> "$GITHUB_ENV"
            echo "Locked account: from the POTERX_PLAYLIST_URL secret."
          elif [ -n "$INPUT_SERVER_URL" ]; then
            echo "::add-mask::$INPUT_SERVER_URL"
            echo "POTERX_SERVER=$INPUT_SERVER_URL" >> "$GITHUB_ENV"
            echo "Locked server: from the workflow form (the user signs in)."
          elif [ -n "$SECRET_SERVER" ]; then
            echo "POTERX_SERVER=$SECRET_SERVER" >> "$GITHUB_ENV"
            if [ -n "$SECRET_USERNAME" ] && [ -n "$SECRET_PASSWORD" ]; then
              echo "POTERX_USERNAME=$SECRET_USERNAME" >> "$GITHUB_ENV"
              echo "POTERX_PASSWORD=$SECRET_PASSWORD" >> "$GITHUB_ENV"
              echo "Locked account: from the POTERX_SERVER/USERNAME/PASSWORD secrets."
            else
              echo "Locked server: from the POTERX_SERVER secret (the user signs in)."
            fi
          else
            echo "::warning::No POTERX_* secret and no form input — building an UNLOCKED (stock OwnTV) APK."
          fi

      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing: repository keystore."
          elif [ "$IS_TAG" = "true" ]; then
            # A release without the repository key would be signed with a throw-away one: the update
            # server would offer an APK no installed copy accepts, and the sealed account is bound to it.
            echo "::error::KEYSTORE_BASE64 is not set: a tag build must be signed with the repository key."
            exit 1
          else
            # A locked APK must still be a RELEASE build (R8 shrinks and obfuscates it), so without a
            # keystore secret a throw-away key is made here. Such an APK installs fine, but the next
            # build's key differs, so an update needs an uninstall first. Add the KEYSTORE_* secrets
            # for installs that update in place.
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" -storepass poterxci -keypass poterxci \
              -alias poterx -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Poterx Mobile CI" >/dev/null 2>&1
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=poterxci" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=poterx" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=poterxci" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_BASE64 secret — signed with a throw-away CI key (updates need an uninstall)."
          fi

      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          # One flavor, the phones' (arm64-v8a + armeabi-v7a); the x86_64 emulator build is not published.
          ./gradlew :app:assembleStandardRelease --stacktrace
          ARM_SRC=$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)
          echo "Built: $ARM_SRC"
          echo "ARM_SRC=$ARM_SRC" >> "$GITHUB_ENV"

      - name: Name the APK
        env:
          LABEL: ${{ inputs.apk_label }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          mkdir -p dist
          SUFFIX=""
          if [ -n "$LABEL" ]; then SUFFIX="-$(echo "$LABEL" | tr -cs 'A-Za-z0-9_.-' '_')"; fi
          if [ "$IS_TAG" = "true" ]; then
            OUT="PoterxMobile-v${VERSION_NAME}${SUFFIX}.apk"
            cp "$ARM_SRC" "dist/PoterxMobile.apk"
          else
            OUT="PoterxMobile-dev-${GITHUB_SHA::7}${SUFFIX}.apk"
          fi
          cp "$ARM_SRC" "dist/$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          echo "Packaged dist/$OUT (arm64-v8a + armeabi-v7a)"

      - name: Release notes and update-server settings
        if: env.IS_TAG == 'true'
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          HAS_VPS: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' && secrets.POTERX_UPDATE_URL != '' }}
        run: |
          FILE="docs/poterx/changelog/${VERSION_NAME}.md"
          if [ ! -f "$FILE" ]; then
            echo "::warning::No $FILE — the release and update.json get a one-line note."
            mkdir -p docs/poterx/changelog
            echo "- Poprawki i ulepszenia (wersja ${VERSION_NAME})." > "$FILE"
          fi
          echo "CHANGELOG_FILE=$FILE" >> "$GITHUB_ENV"
          echo "VPS_CONFIGURED=$HAS_VPS" >> "$GITHUB_ENV"
          echo "Update server configured: $HAS_VPS"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_OUT }}
          path: dist/*
          if-no-files-found: error
          # A dev APK is for a quick test; a tag's APK lives on the Release and the update server.
          # 90 days of 37 MB per push filled the account's Actions storage.
          retention-days: 14

      - name: Publish GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Poterx Mobile ${{ github.ref_name }}
          files: |
            dist/${{ env.APK_OUT }}
            dist/PoterxMobile.apk
          # Poterx: the notes come from docs/poterx/changelog/<version>.md; GitHub's generated notes
          # carry repository links a customer must not see.
          body_path: ${{ env.CHANGELOG_FILE }}
          generate_release_notes: false
          # A tag build is a pre-release until "Promote update" marks it latest together with
          # update-mobile.json, the same two-step the television has.
          prerelease: true
          make_latest: false

      # The provider's own update server, shared with the television: the phone has its own manifests
      # (update-mobile.json / update-mobile-test.json), APK names (apk/poterx-mobile-<v>.apk,
      # apk/PoterxMobile.apk) and changelog folder (changelog-mobile/), so the two apps never offer
      # each other's package. The tag build lands on the TEST channel; the provider promotes it to
      # customers with the "Promote update" workflow after testing. The SSH key is limited to rsync
      # into the web root (rrsync), so nothing here can run a command on the server.
      - name: Publish to the update server (test channel)
        if: env.IS_TAG == 'true' && env.VPS_CONFIGURED == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          UPDATE_URL: ${{ secrets.POTERX_UPDATE_URL }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          MIN_VERSION_CODE: ${{ vars.POTERX_MOBILE_MIN_VERSION_CODE }}
        run: |
          set -euo pipefail
          mkdir -p upload/apk upload/changelog-mobile
          APK="upload/apk/poterx-mobile-${VERSION_NAME}.apk"
          cp "dist/PoterxMobile.apk" "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$SHA  poterx-mobile-${VERSION_NAME}.apk" > "$APK.sha256"
          SIZE=$(stat -c %s "$APK")
          cp "$CHANGELOG_FILE" "upload/changelog-mobile/${VERSION_NAME}.md"
          python3 - "$VERSION_CODE" "$VERSION_NAME" "${UPDATE_URL%/}/apk/poterx-mobile-${VERSION_NAME}.apk" "$SHA" "$SIZE" "${MIN_VERSION_CODE:-0}" "$CHANGELOG_FILE" > upload/update-mobile-test.json <<'PY'
          import json, sys, datetime
          code, name, url, sha, size, min_code, notes_path = sys.argv[1:8]
          print(json.dumps({
              "versionCode": int(code), "versionName": name, "apkUrl": url, "sha256": sha,
              "sizeBytes": int(size), "notes": open(notes_path, encoding="utf-8").read().strip(),
              "minVersionCode": int(min_code),
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, ensure_ascii=False, indent=2))
          PY
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/poterx_ci && chmod 600 ~/.ssh/poterx_ci
          # The server's host key comes from the VPS_KNOWN_HOSTS secret (ssh-keyscan output saved
          # once by the provider); without it the key is fetched now, which trusts the first answer.
          if [ -n "$VPS_KNOWN_HOSTS" ]; then printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else echo "::warning::No VPS_KNOWN_HOSTS secret — trusting the host key ssh-keyscan returns."; ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; fi
          RSH="ssh -i ~/.ssh/poterx_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          rsync -az --rsh="$RSH" upload/apk/ "$VPS_USER@$VPS_HOST:/apk/"
          rsync -az --rsh="$RSH" upload/changelog-mobile/ "$VPS_USER@$VPS_HOST:/changelog-mobile/"
          rsync -az --rsh="$RSH" upload/update-mobile-test.json "$VPS_USER@$VPS_HOST:/update-mobile-test.json"
          echo "Published ${VERSION_NAME} (code ${VERSION_CODE}) to the TEST channel (update-mobile-test.json)."
